<div class="breadcrumb-card mb-25 d-md-flex align-items-center justify-content-between">
    <h5 class="mb-0">Role</h5>
    <ol class="breadcrumb list-unstyled mt-0 mb-0 pl-0">
        <li class="breadcrumb-item position-relative">
            <a routerLink="/" class="d-inline-block position-relative">
                <i class="material-symbols-outlined">
                    admin_panel_settings
                </i>
                Administration
            </a>
        </li>
        <li class="breadcrumb-item position-relative">Roles</li>
    </ol>
</div>
<mat-card class="daxa-card create-product-card mb-25 border-radius bg-white border-none d-block">
    <mat-card-content>
        <form [formGroup]="RoleForm" (ngSubmit)="onSubmit()">
            <div class="row">
                <!-- Role name -->
                <div class="col-md-5 col-12">
                    <div class="mb-25">
                        <label class="main-label d-block lh-1 text-black">Role name</label>
                        <mat-form-field>
                            <mat-label>Role name</mat-label>
                            <input matInput placeholder="Role name" formControlName="roleName"
                                required />
                            <mat-error *ngIf="RoleForm?.get('roleName')?.hasError('required')">
                                This field is required
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <!-- Role description -->
                <div class="col-md-5 col-12">
                    <div class="mb-25">
                        <label class="main-label d-block lh-1 text-black">Role description</label>
                        <mat-form-field>
                            <mat-label>Role description</mat-label>
                            <input matInput placeholder="Role description" formControlName="roleDescription"
                                required />
                            <mat-error *ngIf="RoleForm?.get('roleDescription')?.hasError('required')">
                                This field is required
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <!-- Active -->
                <div class="col-md-2 col-12 align-content-center">
                    <div class="mb-25">
                        <mat-checkbox class="example-margin" formControlName="markInActive">
                            Active
                        </mat-checkbox>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-3 btn-box">
                <button mat-button mat-flat-button class="daxa" type="submit" [disabled]="RoleForm.invalid">
                    {{editMode ?'Update':'Create'}} Role
                </button>
                <!-- Error Message -->
                <mat-error *ngIf="errorMsg">{{ errorMsg }}</mat-error>
            </div>
        </form>

        <hr>

        <div class="products-list-table">
            <div class="table-responsive">
                <table mat-table [dataSource]="dataSource">
                    <!-- Role Name Column -->
                    <ng-container matColumnDef="roleName">
                        <th mat-header-cell *matHeaderCellDef>Role Name</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                {{ element?.roleName }}
                            </div>
                        </td>
                    </ng-container>

                    <!-- Role Description Column -->
                    <ng-container matColumnDef="roleDescription">
                        <th mat-header-cell *matHeaderCellDef>Role Description</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                {{ element?.roleDescription }}
                            </div>
                        </td>
                    </ng-container>

                    <!-- Active Column -->
                    <ng-container matColumnDef="active">
                        <th mat-header-cell *matHeaderCellDef>Active</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                <div class="info d-flex align-items-center">
                                    <span class="badge rounded-pill text-soft-success"
                                        *ngIf="element?.active">Active</span>
                                    <span class="badge rounded-pill text-soft-danger"
                                        *ngIf="!element?.active">Inactive</span>
                                </div>
                            </div>
                        </td>
                    </ng-container>

                    <!-- Action Column -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef>Action</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="action-info">
                                <button mat-icon-button [matMenuTriggerFor]="menu"
                                    aria-label="Example icon-button with a menu">
                                    <mat-icon>more_vert</mat-icon>
                                </button>
                                <mat-menu #menu="matMenu">
                                    <button mat-menu-item (click)="passData(element)">
                                        <mat-icon>edit</mat-icon>
                                        <span>Edit</span>
                                    </button>
                                </mat-menu>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

                    <!-- Row shown when there is no matching data. -->
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="4">
                            No data matching the filter
                        </td>
                    </tr>
                </table>
            </div>
            <mat-paginator #paginator [length]="count" [pageSize]="pageSize" [pageSizeOptions]="[10, 20, 30]"
                showFirstLastButtons aria-label="Select page"></mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
