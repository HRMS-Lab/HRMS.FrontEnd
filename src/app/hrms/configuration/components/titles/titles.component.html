<app-header-screen [title]="'Titles'" [icon]="'app_registration'" [breadcrumb]="'Configuration'"></app-header-screen>

<mat-card class="daxa-card create-product-card mb-25 border-radius bg-white border-none d-block">
    <mat-card-content>
        <div class="products-list-table">
            <div class="table-responsive">
                <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                    <!-- Title Name -->
                    <ng-container matColumnDef="titleName">
                        <th mat-header-cell *matHeaderCellDef>Title Name</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                {{ element?.titleName }}
                            </div>
                        </td>
                    </ng-container>

                    <!-- Title Description -->
                    <ng-container matColumnDef="titleDescription">
                        <th mat-header-cell *matHeaderCellDef>Title Description</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                {{ element?.titleDescription }}
                            </div>
                        </td>
                    </ng-container>

                    <!-- Reference 1 -->
                    <ng-container matColumnDef="refrence1">
                        <th mat-header-cell *matHeaderCellDef>Reference 1</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                {{ element?.refrence1 }}
                            </div>
                        </td>
                    </ng-container>

                    <!-- Reference 2 -->
                    <ng-container matColumnDef="refrence2">
                        <th mat-header-cell *matHeaderCellDef>Reference 2</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                {{ element?.refrence2 }}
                            </div>
                        </td>
                    </ng-container>

                    <!-- Status -->
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef>Status</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                <div class="info d-flex align-items-center">
                                    <span class="badge rounded-pill text-soft-success"
                                        *ngIf="element?.active">Active</span>
                                    <span class="badge rounded-pill text-soft-danger"
                                        *ngIf="!element?.active">Inactive</span>
                                </div>
                            </div>
                        </td>
                    </ng-container>

                    <!-- Action -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef>Action</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="action-info">
                                <button mat-icon-button [matMenuTriggerFor]="menu"
                                    aria-label="Example icon-button with a menu">
                                    <mat-icon>more_vert</mat-icon>
                                </button>
                                <mat-menu #menu="matMenu">
                                    <ul class="menu-body pl-0 mb-0 mt-0 list-unstyled">
                                        <li mat-menu-item class="position-relative transition fw-medium"
                                            [routerLink]="['/hrms/configuration/title-form', element.titleId]">
                                            <i class="material-symbols-outlined">edit</i>
                                            <span>Edit</span>
                                            <a class="link-btn d-block position-absolute"></a>
                                        </li>

                                    </ul>
                                </mat-menu>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

                    <!-- Row shown when there is no matching data. -->
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell text-center" colspan="5">
                            No data matching the filter
                        </td>
                    </tr>
                </table>
            </div>
            <mat-paginator #paginator [length]="count" [pageSize]="pageSize" [pageSizeOptions]="[10, 20, 30]"
                showFirstLastButtons aria-label="Select page"></mat-paginator>
        </div>

    </mat-card-content>
</mat-card>
