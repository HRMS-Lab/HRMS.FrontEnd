<!-- Breadcrumb -->
<div
    class="breadcrumb-card mb-25 d-md-flex align-items-center justify-content-between"
>
    <h5 class="mb-0">Branches List</h5>
    <ol class="breadcrumb list-unstyled mt-0 mb-0 pl-0">
        <li class="breadcrumb-item position-relative">
            <a routerLink="/" class="d-inline-block position-relative">
                <i class="material-symbols-outlined">
                    app_registration
                </i>
                Lookup
            </a>
        </li>
        <li class="breadcrumb-item position-relative">Branches</li>
    </ol>
</div>

<!-- Products List -->
<mat-card
    class="daxa-card products-list-card mb-25 border-radius bg-white border-none d-block"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
>
    <mat-card-header>
        <mat-card-subtitle>
            <a mat-button class="add-new-btn" routerLink="/lookup/branches/branch-form">
                + Add Branch
            </a>
        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <div class="products-list-table">
            <div class="table-responsive">
                <table mat-table [dataSource]="dataSource">
                    <!-- Product Column -->
                    <ng-container matColumnDef="branchName">
                        <th mat-header-cell *matHeaderCellDef>Branch Name</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                <a class="d-block fw-medium">
                                    {{ element?.branchName }}
                                </a>
                            </div>
                        </td>
                    </ng-container>

                    <!-- District Column -->
                    <!-- <ng-container matColumnDef="districtName">
                        <th mat-header-cell *matHeaderCellDef>District Name</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="info d-flex align-items-center">
                                <a class="d-block fw-medium">
                                    {{ element?.districtId }}
                                </a>
                            </div>
                        </td>
                    </ng-container> -->

                    <!-- Price Column -->
                    <ng-container matColumnDef="refrence1">
                        <th mat-header-cell *matHeaderCellDef>Ref1</th>
                        <td mat-cell *matCellDef="let element">
                            {{ element?.refrence1 }}
                        </td>
                    </ng-container>

                    <!-- Stock Quantity Column -->
                    <ng-container matColumnDef="refrence2">
                        <th mat-header-cell *matHeaderCellDef>Ref2</th>
                        <td mat-cell *matCellDef="let element">
                            {{ element?.refrence2 }}
                        </td>
                    </ng-container>

                    <!-- Stock Quantity Column -->
                    <ng-container matColumnDef="refrence3">
                        <th mat-header-cell *matHeaderCellDef>Ref3</th>
                        <td mat-cell *matCellDef="let element">
                            {{ element?.refrence3 }}
                        </td>
                    </ng-container>

                    <!-- Stock Quantity Column -->
                    <ng-container matColumnDef="refrence4">
                        <th mat-header-cell *matHeaderCellDef>Ref4</th>
                        <td mat-cell *matCellDef="let element">
                            {{ element?.refrence4 }}
                        </td>
                    </ng-container>

                    <!-- Date Column -->
                    <ng-container matColumnDef="active">
                        <th mat-header-cell *matHeaderCellDef>Active</th>
                        <td mat-cell *matCellDef="let element">
                            {{ element?.active }}
                        </td>
                    </ng-container>

                    <!-- Action Column -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef>Action</th>
                        <td mat-cell *matCellDef="let element">
                            <div class="action-info">
                                <button mat-icon-button [matMenuTriggerFor]="menu"
                                    aria-label="Example icon-button with a menu">
                                    <mat-icon>more_vert</mat-icon>
                                </button>
                                <mat-menu #menu="matMenu">
                                    <button mat-menu-item
                                        [routerLink]="['/lookup/branches/branch-form', element.regionId, element.branchId]">
                                        <mat-icon>edit</mat-icon>
                                        <span>Edit</span>
                                    </button>
                                    <!-- <button mat-menu-item [routerLink]="['/lookup/district/district-list', element.regionId]">
                                        <mat-icon>visibility</mat-icon>
                                        <span>District</span>
                                    </button> -->
                                </mat-menu>
                                <!-- <a
                                    mat-button
                                    (click)="
                                        getToViewPageandSetIds(
                                            element?.branchId
                                        )
                                    "
                                    matTooltip="View"
                                    matTooltipPosition="above"
                                >
                                    <i class="material-symbols-outlined">
                                        view
                                    </i>
                                </a> -->
                                <!-- <a
                                    mat-button
                                    (click)="
                                        getToEditPageandSetIds(
                                            element?.branchId
                                        )
                                    "
                                    matTooltip="Edit"
                                    matTooltipPosition="above"
                                >
                                    <i class="material-symbols-outlined">
                                        edit
                                    </i>
                                </a> -->
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr
                        mat-row
                        *matRowDef="let row; columns: displayedColumns"
                    ></tr>

                    <!-- Row shown when there is no matching data. -->
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="4">
                            No data matching the filter
                        </td>
                    </tr>
                </table>
            </div>
            <mat-paginator
                [pageSizeOptions]="[10, 20, 30]"
                showFirstLastButtons
            ></mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
