<div class="container">
    <div class="image-section"></div>
    <div class="form-section">
        <div class="sign-in-area">
            <div class="d-table">
                <div class="d-table-cell">
                    <div class="daxa-form ml-auto mr-auto border-radius bg-white"
                        [class.card-borderd-theme]="themeService.isCardBorder()"
                        [class.component-dark-theme]="themeService.isDark()"
                        [class.rtl-enabled]="themeService.isRTLEnabled()">
                        <div class="title text-center">
                            <div class="d-flex align-items-center justify-content-center">
                                <img src="images/logo-icon.svg" alt="logo-icon">
                                <span class="fw-semibold" style="margin-left: 6px;">
                                    <h3>Login</h3>
                                </span>
                            </div>
                            <!-- <p class="text-black">
                                Don’t have an account yet? <a routerLink="/authentication/sign-up" class="text-daxa">Sign Up</a>
                            </p> -->
                        </div>
                        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                            <!-- <div class="form-group">
                                <label class="main-label d-block lh-1 text-black">
                                    Orginzation
                                </label>
                                <mat-form-field>
                                    <mat-label>
                                        Enter Orginzation
                                    </mat-label>
                                    <input matInput type="text" id="orginzationId" formControlName="orginzationId">
                                </mat-form-field>
                                <div class="error text-danger"
                                    *ngIf="loginForm.get('orginzationId')!.hasError('required') && loginForm.get('orginzationId')!.touched">
                                    Orginzation is required.
                                </div>
                            </div> -->
                            <div class="form-group">
                                <label class="main-label d-block lh-1 text-black">
                                    User Name
                                </label>
                                <mat-form-field>
                                    <mat-label>
                                        Enter User Name
                                    </mat-label>
                                    <input matInput type="text" id="userName" formControlName="userName">
                                </mat-form-field>
                                <div class="error text-danger"
                                    *ngIf="loginForm.get('userName')!.hasError('required') && loginForm.get('userName')!.touched">
                                    User Name is required.
                                </div>
                                <!-- <div class="error text-danger" *ngIf="loginForm.get('email')!.hasError('email') && loginForm.get('email')!.touched">
                                    Please enter a valid email address.
                                </div> -->
                            </div>
                            <div class="form-group">
                                <label class="main-label d-block lh-1 text-black">
                                    Your Password
                                </label>
                                <mat-form-field>
                                    <mat-label>
                                        Enter your password
                                    </mat-label>
                                    <input matInput [type]="hide ? 'password' : 'text'" id="password"
                                        formControlName="password">
                                    <button mat-icon-button matSuffix (click)="hide = !hide"
                                        [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                                        <span class="material-symbols-outlined">
                                            {{hide ? 'visibility_off' : 'visibility'}}
                                        </span>
                                    </button>
                                </mat-form-field>
                                <div class="error text-danger"
                                    *ngIf="loginForm.get('password')!.hasError('required') && loginForm.get('password')!.touched">
                                    Password is required.
                                </div>
                                <div class="error text-danger"
                                    *ngIf="loginForm.get('password')!.hasError('minlength') && loginForm.get('password')!.touched">
                                    Password must be at least 8 characters long.
                                </div>
                            </div>
                            <!-- <div class="info d-flex justify-content-between align-items-center">
                                <mat-checkbox>
                                    Remember me
                                </mat-checkbox>
                                <a routerLink="/authentication/forgot-password" class="d-inline-block text-daxa">
                                    Forgot Password?
                                </a>
                            </div> -->
                            <span *ngIf="errorMsg" class="error text-danger">{{errorMsg}}</span>
                            <button mat-flat-button class="daxa w-100" type="submit" [disabled]="loginForm.invalid">
                                Login
                                <mat-icon style="display: inline-table;">
                                    <mat-spinner diameter="20" color="warn" *ngIf="buttonLoader"> </mat-spinner>
                                </mat-icon>
                                <!-- <mat-spinner strokeWidth="3" color="gray"></mat-spinner> -->
                            </button>
                            <!-- <div class="signin-with-socials text-center">
                                <div class="or position-relative">
                                    <span class="d-inline-block">
                                        or sign in with
                                    </span>
                                </div>
                                <div class="socials">
                                    <button mat-button type="button" class="facebook">
                                        <i class="ri-facebook-fill"></i>
                                    </button>
                                    <button mat-button type="button" class="twitter">
                                        <i class="ri-twitter-x-fill"></i>
                                    </button>
                                    <button mat-button type="button" class="google">
                                        <i class="ri-google-fill"></i>
                                    </button>
                                    <button mat-button type="button" class="linkedin">
                                        <i class="ri-linkedin-fill"></i>
                                    </button>
                                </div>
                            </div> -->
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
